services:
  ##############
  # AES
  ##############
  aes-go:
    image: vhiveease/aes-go:latest
    container_name: aes-go
    cpuset: "1"
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50051
    ports:
      - target: 50051
  relay_aes-go:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50000
      - --function-endpoint-url=aes-go
      - --function-endpoint-port=50051
      - --function-name=aes-go
    ports:
        - published: 50000
          target: 50000

  ##############
  # AUTH
  ##############
  auth-go:
    image: vhiveease/auth-go:latest
    container_name: auth-go
    cpuset: "1"
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50052
    ports:
      - target: 50052
  relay_auth-go:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50001
      - --function-endpoint-url=auth-go
      - --function-endpoint-port=50052
      - --function-name=auth-go
    ports:
        - published: 50001
          target: 50001

  ##############
  # FIB
  ##############
  fibonacci-go:
    image: vhiveease/fibonacci-go:latest
    container_name: fibonacci-go
    cpuset: "1"
    entrypoint:
      - /app/server
      - -addr=0.0.0.0:50053
    ports:
      - target: 50053
  relay_fib-go:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50002
      - --function-endpoint-url=fibonacci-go
      - --function-endpoint-port=50053
      - --function-name=fibonacci-go
      - --value=10
      - --generator=linear
      - --lowerBound=1
      - --upperBound=10
    ports:
        - published: 50002
          target: 50002

  ##############
  # HOTEL-APP
  ##############
  geo:
    image: vhiveease/hotel-app-geo:latest
    container_name: geo
    cpuset: "1"
    entrypoint:
      - /app/server
      - --url=0.0.0.0
      - --port=8083
      - --db_addr=database_geo:5432
    ports:
    - published: 8083
      target: 8083
    depends_on:
      - database_geo
  database_geo:
    image: vhiveease/postgres
    container_name: geo-db
    cpuset: "2"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hotel_geo
  relay_geo:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50003
      - --function-endpoint-url=geo
      - --function-endpoint-port=8083
      - --function-name=geo
    ports:
        - published: 50003
          target: 50003
    depends_on:
      - geo

  profile:
    image: vhiveease/hotel-app-profile:latest
    container_name: profile
    cpuset: "1"
    entrypoint:
      - /app/server
      - --url=0.0.0.0
      - --port=8084
      - --db_addr=database_profile:5432
      - --memcached_addr=memcached_profile:11211
    ports:
    - published: 8084
      target: 8084
    depends_on:
      - database_profile
      - memcached_profile
  database_profile:
    image: vhiveease/postgres
    container_name: profile-db
    cpuset: "2"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hotel_profile
  memcached_profile:
    image: vhiveease/memcached
    container_name: 'profile-mmc'
    cpuset: "2"
    environment:
      - MEMCACHED_CACHE_SIZE=128
      - MEMCACHED_THREADS=2
    logging:
      options:
        max-size: 50m
  relay_profile:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50004
      - --function-endpoint-url=profile
      - --function-endpoint-port=8084
      - --function-name=profile
      - --value="2,12,21"
    ports:
        - published: 50004
          target: 50004
    depends_on:
      - profile

  rate:
    image: vhiveease/hotel-app-rate:latest
    container_name: rate
    cpuset: "1"
    entrypoint:
      - /app/server
      - --url=0.0.0.0
      - --port=8085
      - --db_addr=database_rate:5432
      - --memcached_addr=memcached_rate:11211
    ports:
    - published: 8085
      target: 8085
    depends_on:
      - database_rate
      - memcached_rate
  database_rate:
    image: vhiveease/postgres
    container_name: rate-db
    cpuset: "2"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hotel_rate
  memcached_rate:
    image: vhiveease/memcached
    container_name: 'rate-mmc'
    cpuset: "2"
    environment:
      - MEMCACHED_CACHE_SIZE=128
      - MEMCACHED_THREADS=2
    logging:
      options:
        max-size: 50m
  relay_rate:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50005
      - --function-endpoint-url=rate
      - --function-endpoint-port=8085
      - --function-name=rate
      - --value=1
    ports:
        - published: 50005
          target: 50005

  recommendation:
    image: vhiveease/hotel-app-recommendation:latest
    container_name: recommendation
    cpuset: "1"
    entrypoint:
      - /app/server
      - --url=0.0.0.0
      - --port=8086
      - --db_addr=database_recommendation:5432
    ports:
      - published: 8086
        target: 8086
    depends_on:
      - database_recommendation
  database_recommendation:
    image: vhiveease/postgres
    container_name: recommendation-db
    cpuset: "2"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hotel_recommendation
  relay_recommendation:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50006
      - --function-endpoint-url=recommendation
      - --function-endpoint-port=8086
      - --function-name=recommendation
      - --value="dis"
    ports:
        - published: 50006
          target: 50006
    depends_on:
      - recommendation

  reservation:
    image: vhiveease/hotel-app-reservation:latest
    container_name: reservation
    cpuset: "1"
    entrypoint:
      - /app/server
      - --url=0.0.0.0
      - --port=8087
      - --db_addr=database_reservation:5432
      - --memcached_addr=memcached_reservation:11211
    ports:
    - published: 8087
      target: 8087
    depends_on:
      - database_reservation
      - memcached_reservation
  database_reservation:
    image: vhiveease/postgres
    container_name: reservation-db
    cpuset: "2"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hotel_reservation
  memcached_reservation:
    image: vhiveease/memcached
    container_name: 'reservation-mmc'
    cpuset: "2"
    environment:
      - MEMCACHED_CACHE_SIZE=128
      - MEMCACHED_THREADS=2
    logging:
      options:
        max-size: 50m
  relay_reservation:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50007
      - --function-endpoint-url=reservation
      - --function-endpoint-port=8087
      - --function-name=reservation
      - --function-method=CheckAvailability
    ports:
        - published: 50007
          target: 50007
    depends_on:
      - reservation

  user:
    image: vhiveease/hotel-app-user:latest
    container_name: user
    cpuset: "1"
    entrypoint:
      - /app/server
      - --url=0.0.0.0
      - --port=8088
      - --db_addr=database_user:5432
    ports:
    - published: 8088
      target: 8088
    depends_on:
      - database_user
  database_user:
    image: vhiveease/postgres
    container_name: user-db
    cpuset: "2"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=hotel_user
  relay_user:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50008
      - --function-endpoint-url=user
      - --function-endpoint-port=8088
      - --function-name=user
      - --value=hello
    ports:
        - published: 50008
          target: 50008
    depends_on:
      - user

  ##############
  # ONLINE-SHOP
  ##############
  productcatalogservice:
    image: vhiveease/onlineshop-productcatalogservice:latest
    container_name: 'productcatalogservice'
    cpuset: "1"
    environment:
      - PORT=3550
      - DISABLE_PROFILER=true
      - DISABLE_DEBUGGER=true
      - DISABLE_TRACING=true
    ports:
    - target: 3550
  relay_productcatalogservice:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50009
      - --function-endpoint-url=productcatalogservice
      - --function-endpoint-port=3550
      - --function-name=productcatalogservice
      - --generator=unique
      - --value=loremipsum
      - --function-method=ListProducts
    ports:
      - published: 50009
        target: 50009

  shippingservice:
    image: vhiveease/onlineshop-shippingservice:latest
    container_name: 'shippingservice'
    cpuset: "1"
    environment:
      - PORT=3551
      - DISABLE_PROFILER=true
      - DISABLE_DEBUGGER=true
      - DISABLE_TRACING=true
    ports:
    - target: 3551
  relay_shippingservice:
    image: vhiveease/relay:latest
    entrypoint:
      - /app/server
      - --addr=0.0.0.0:50010
      - --function-endpoint-url=shippingservice
      - --function-endpoint-port=3551
      - --function-name=shippingservice
      - --generator=unique
      - --function-method=ShipOrder
    ports:
      - published: 50010
        target: 50010

